<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <!-- Tabela de clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela">
                    <!-- Linhas carregadas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/clientes';
        const tabelaClientes = document.getElementById('clientes-tabela');

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro,
                cliente.numero,
                cliente.complemento,
                cliente.bairro,
                cliente.cidade,
                cliente.estado
            ].filter(p => p && p.trim() !== '');

            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        async function carregarClientes() {
            const response = await fetch(API_URL);
            const clientes = await response.json();
            tabelaClientes.innerHTML = '';

            if (clientes.length === 0) {
                tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                return;
            }

            clientes.forEach(cliente => {
                const row = document.createElement('tr');

                const colNome = document.createElement('td');
                colNome.textContent = cliente.nome || '—';

                const colTelefone = document.createElement('td');
                colTelefone.textContent = cliente.telefone || '—';

                const colEndereco = document.createElement('td');
                colEndereco.textContent = formatarEndereco(cliente);

                const colAcoes = document.createElement('td');
                colAcoes.className = 'text-end pe-4';

                const linkEditar = document.createElement('a');
                linkEditar.href = '/clientes/editar/' + encodeURIComponent(cliente.id);
                linkEditar.className = 'btn btn-sm btn-outline-primary me-1';
                linkEditar.innerHTML = '<i class="bi bi-pencil-fill"></i> Editar';

                const botaoExcluir = document.createElement('button');
                botaoExcluir.className = 'btn btn-sm btn-outline-danger';
                botaoExcluir.innerHTML = '<i class="bi bi-trash-fill"></i> Excluir';
                botaoExcluir.addEventListener('click', () => excluirCliente(cliente.id));

                colAcoes.append(linkEditar, botaoExcluir);
                row.append(colNome, colTelefone, colEndereco, colAcoes);
                tabelaClientes.appendChild(row);
            });
        }

        async function excluirCliente(id) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                const token = document.querySelector('meta[name="_csrf"]').content;
                const header = document.querySelector('meta[name="_csrf_header"]').content;
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE',
                    headers: { [header]: token }
                });
                if (response.ok) {
                    alert('Cliente excluído com sucesso!');
                    carregarClientes();
                } else {
                    alert('Erro ao excluir o cliente.');
                }
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
